# =====================================================================
# Messenger service configuration
#
# Secrets are NEVER stored here. Every sensitive value is read from an
# environment variable (or a JVM system property with the same name).
# Syntax: ${ENV_VAR:default}
# =====================================================================

spring.application.name=messenger

# ---------------------------------------------------------------------
# Common (tenant registry) database - read by Credentials.java
# ---------------------------------------------------------------------
common.database.url=${COMMON_DB_URL:jdbc:mysql://localhost:3306/common?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true}
common.database.catalog=${COMMON_DB_CATALOG:common}
common.database.user=${COMMON_DB_USER:root}
common.database.password=${COMMON_DB_PASSWORD:}
common.database.driver=${COMMON_DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Tenant connection pools (one small pool per customer database)
tenant.pool.max-size=${TENANT_POOL_MAX_SIZE:5}

# Tenant used when no customerId was resolved for the current request (optional)
customer.id=${DEFAULT_CUSTOMER_ID:}

# ---------------------------------------------------------------------
# Authentication service
# ---------------------------------------------------------------------
auth.token.type=Bearer
auth.project.id=1
auth.url=${AUTH_VALIDATE_URL:https://localhost:8080/ncs/token/validateToken}
auth.connect-timeout-ms=${AUTH_CONNECT_TIMEOUT_MS:5000}
auth.read-timeout-ms=${AUTH_READ_TIMEOUT_MS:10000}

# ---------------------------------------------------------------------
# Message encryption at rest (AES-256-GCM)
# Generate a key with:  openssl rand -base64 32
# ---------------------------------------------------------------------
messenger.encryption.key=${MESSENGER_ENCRYPTION_KEY:}

# ---------------------------------------------------------------------
# Image upload
# ---------------------------------------------------------------------
upload.images.path=${UPLOAD_IMAGES_PATH:/tsl/midd_data/portal/#customerName#/img/messenger}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

# ---------------------------------------------------------------------
# Web / WebSocket security
# ---------------------------------------------------------------------
# Comma separated list of origins allowed to open the WebSocket (e.g. https://*.example.com).
# Empty = same origin only.
messenger.allowed-origins=${MESSENGER_ALLOWED_ORIGINS:}
# Value of the CSP frame-ancestors directive (who may embed the chat in an iframe).
messenger.frame-ancestors=${MESSENGER_FRAME_ANCESTORS:'self'}

# Verbose logs (never logs message content or tokens)
is.debug.mode=${MESSENGER_DEBUG:false}

# ---------------------------------------------------------------------
# JPA
# ---------------------------------------------------------------------
spring.jpa.database=MYSQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
# Tenant databases are only known at request time, do not probe JDBC metadata on startup
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# ---------------------------------------------------------------------
# Errors / actuator / API docs
# ---------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=${MESSENGER_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${MESSENGER_API_DOCS_ENABLED:false}
springdoc.packages-to-scan=com.ts.messenger.controller
